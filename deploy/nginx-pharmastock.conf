# Reverse proxy HTTPS — à utiliser uniquement si l'officine doit être joignable
# depuis l'extérieur (autre bâtiment, pharmacien à distance).
#   1. sudo apt install -y nginx certbot python3-certbot-nginx
#   2. sudo cp deploy/nginx-pharmastock.conf /etc/nginx/sites-available/pharmastock
#   3. sudo ln -s /etc/nginx/sites-available/pharmastock /etc/nginx/sites-enabled/
#   4. adapter server_name et APP_ORIGIN (https://stock.mapharmacie.mg)
#   5. sudo certbot --nginx -d stock.mapharmacie.mg
server {
    listen 80;
    server_name stock.mapharmacie.mg;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pas de mise en cache : les écrans doivent toujours refléter le stock réel.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
